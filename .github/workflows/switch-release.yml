name: Switch Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/llama-switch.nro
          fail_on_unmatched_files: true
          generate_release_notes: true
          name: Nintendo Switch Build ${{ github.ref_name }}
          body: |
            Standalone LLama-cpp-switch release.
            Includes `llama-switch.nro` built for Nintendo Switch (copy it to `sdmc:/switch/`).
